<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.authors }} — {{ page.venue }}, {{ page.year }}</p>
  <p class="status">Status: {{ page.status }}</p>
  {% if page.codeurl %}
  <p><a class="code-link" href="{{ page.codeurl }}">Code</a></p>
  {% endif %}
  {{ content }}
</article>
</body>
</html>
